    <script>
      function animateCounter(element, target, duration) {
        duration = duration || 1800;
        var start = 0;
        var step = target / (duration / 16);
        var prefix = element.dataset.prefix || "";
        var suffix = element.dataset.suffix || "";
        var timer = setInterval(function () {
          start += step;
          if (start >= target) {
            element.textContent = prefix + target + suffix;
            clearInterval(timer);
          } else {
            element.textContent = prefix + Math.floor(start) + suffix;
          }
        }, 16);
      }

      var counterObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var el = entry.target;
            animateCounter(el, parseInt(el.dataset.target));
            counterObserver.unobserve(el);
          }
        });
      }, { threshold: 0.5 });

      function observeCounters() {
        document.querySelectorAll(".stat-number[data-target]:not([data-observed])").forEach(function (el) {
          el.dataset.observed = "1";
          counterObserver.observe(el);
        });
      }

      // Run on initial load
      document.addEventListener("DOMContentLoaded", observeCounters);

      // Re-run only when React adds new DOM nodes (SPA navigation), not on text changes
      var domWatcher = new MutationObserver(function (mutations) {
        var hasNewNodes = mutations.some(function (m) { return m.addedNodes.length > 0; });
        if (hasNewNodes) observeCounters();
      });
      domWatcher.observe(document.body, { childList: true, subtree: true });
    </script>

    <script>
      // ─── S5: ANIMAÇÃO DE ENTRADA SÓ COMO REALCE ──────────────────────
      // O conteúdo é visível por padrão. Apenas elementos [data-aos] que
      // ainda estão ABAIXO da tela recebem .il-pending e são revelados assim
      // que chegam à área visível ou ficam para trás na rolagem.
      (function () {
        if (!window.requestAnimationFrame || !window.MutationObserver) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var pending = [];
        var ticking = false;
        function reveal(el) {
          var d = Math.min(parseInt(el.getAttribute('data-aos-delay') || '0', 10) || 0, 300);
          el.style.transitionDelay = d + 'ms';
          el.classList.add('il-in');
          setTimeout(function () {
            el.classList.remove('il-pending', 'il-in');
            el.style.transitionDelay = '';
          }, 700 + d);
        }
        function check() {
          ticking = false;
          var vh = window.innerHeight || document.documentElement.clientHeight;
          pending = pending.filter(function (el) {
            if (!el.isConnected) return false;
            // revela tudo que já entrou na tela OU ficou para trás (rolagem rápida/âncora)
            if (el.getBoundingClientRect().top < vh - 40) { reveal(el); return false; }
            return true;
          });
        }
        function schedule() {
          if (!ticking) { ticking = true; requestAnimationFrame(check); }
        }
        function scan() {
          var vh = window.innerHeight || document.documentElement.clientHeight;
          document.querySelectorAll('[data-aos]:not([data-il])').forEach(function (el) {
            el.setAttribute('data-il', '1');
            if (el.getBoundingClientRect().top > vh) {
              el.classList.add('il-pending');
              pending.push(el);
            }
          });
          schedule();
        }
        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule);
        new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) {
            if (muts[i].addedNodes.length) { scan(); break; }
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
        if (document.readyState !== 'loading') scan();
        else document.addEventListener('DOMContentLoaded', scan);
        // rechecagem periódica (layout pode mudar sem rolagem, ex.: imagens carregando)
        setInterval(schedule, 1000);
      })();
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {

        // ─── NAVBAR COM FUNDO AO ROLAR ───────────────────────────────────
        var navbar = document.querySelector('nav, header, .navbar, .nav');
        if (navbar) {
          window.addEventListener('scroll', function () {
            if (window.scrollY > 60) {
              navbar.classList.add('scrolled');
            } else {
              navbar.classList.remove('scrolled');
            }
          });
        }

        // ─── FAQ COM ANIMAÇÃO ────────────────────────────────────────────
        document.querySelectorAll('.faq-question').forEach(function (question) {
          question.addEventListener('click', function () {
            var item = question.closest('.faq-item');
            var isOpen = item.classList.contains('open');
            document.querySelectorAll('.faq-item').forEach(function (i) { i.classList.remove('open'); });
            if (!isOpen) item.classList.add('open');
          });
        });
      });
    </script>
